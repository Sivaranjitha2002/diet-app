<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DietSail - AI-Powered Diet Tracker</title>
    
    <!-- PWA meta tags -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Smart meal planning and nutrition tracking with AI recommendations" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DietSail" />
    <link rel="apple-touch-icon" href="/diet-icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/diet-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script type="module" crossorigin src="/assets/main-RYAhDyqc.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-BHQz98lt.css">
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
